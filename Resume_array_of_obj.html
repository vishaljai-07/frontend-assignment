<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Resume</title>

    <style>
        html {
            background-color: #f1f5f9;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            color: #334155;
            max-width: 800px;
            margin: 30px auto;
            padding: 35px 40px;
            line-height: 1.6;
            box-sizing: border-box;
            border-top: 6px solid #17365d;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(23, 54, 93, 0.10);
        }

        .photo {
            float: right;
            width: 105px;
            height: 125px;
            object-fit: cover;
            object-position: center;
            border: 3px solid #dbeafe;
            border-radius: 10px;
            margin: 0 0 10px 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.10);
        }

        h1 {
            color: #17365d;
            font-family: "Times New Roman", serif;
            font-size: 27px;
            margin-top: 0;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }

        #degree {
            color: #0f766e;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        h2 {
            color: #17365d;
            font-size: 18px;
            border-bottom: 2px solid #cbdfe8;
            border-left: 4px solid #0f766e;
            padding: 0 0 6px 10px;
            margin-top: 25px;
            margin-bottom: 12px;
        }

        h3 {
            color: #0f766e;
            font-size: 16px;
            margin-bottom: 5px;
        }

        p {
            color: #334155;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        ul {
            padding-left: 25px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        li {
            padding-left: 3px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        a {
            color: #0f766e;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        a:hover {
            color: #17365d;
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 1px solid #dbe3ec;
            clear: both;
            margin-top: 18px;
            margin-bottom: 18px;
        }

        
    </style>
</head>

<body>

    <img src="image.jpeg" alt="Vishal Profile" class="photo">

    <h1 id="name"></h1>
    <h3 id="degree"></h3>

    <h2>Contact</h2>
    <p>Phone: <span id="phone"></span></p>
    <p>Email: <a id="email"></a></p>
    <p>Location: <span id="location"></span></p>

    <hr>

    <h2>Profile</h2>
    <p id="profile"></p>

    <hr>

    <h2>Education</h2>
    <ul id="education"></ul>

    <hr>

    <h2>Internship Experience</h2>
    <ul id="experience"></ul>

    <hr>

    <h2>Skills</h2>
    <ul id="skills"></ul>

    <hr>

    <h2>Achievements</h2>
    <ul id="awards"></ul>

    <hr>

    <h2>Languages</h2>
    <ul id="languages"></ul>

    <hr>

    <h2>Declaration</h2>
    <p id="declaration"></p>

    <script>
        const userData = [{
            name: "Vishal",
            degree: "B.Tech Information Technology",
            email: "vishaljairam@gmail.com",
            phone: "9791205137",
            location: "Chennai, Tamil Nadu",

            profile: "Motivated B.Tech Information Technology student with internship experience. Skilled in Python, Linux, HTML, CSS and networking fundamentals. Interested in learning new technologies and improving problem-solving and teamwork skills.",

            educationDetails: [
                {
                    name: "S.A. Engineering College",
                    degree: "B.Tech Information Technology",
                    year: "2023 - Present",
                    cgpa: "7.68 up to Semester VI"
                },
                {
                    name: "Shri Krishnaswamy Matric Higher Secondary School",
                    degree: "Higher Secondary Education",
                    year: "2022 - 2023",
                    percentage: "60%"
                }
            ],

            internshipDetails: [
                {
                    role: "Cyber Security Intern",
                    description: "Monitored and analyzed security events using SIEM tools. Performed basic vulnerability assessment."
                }
            ],

            skills: [
                "Python",
                "Linux",
                "Networking Fundamentals"
            ],

            awards: [
                "MAGNUS25 - Paper Presentation Participant",
                "Agentic AI Master Class - Workshop Participant"
            ],

            languages: [
                "English",
                "Tamil",
                "Hindi"
            ],

            declaration: "I hereby declare that the information provided above is true and accurate to the best of my knowledge. I am committed to maintaining professionalism, integrity and continuous learning."
        }];

        const data = userData[0];

        document.getElementById("name").innerText = data.name;
        document.getElementById("degree").innerText = data.degree;
        document.getElementById("phone").innerText = data.phone;

        document.getElementById("email").innerText = data.email;
        document.getElementById("email").href = "mailto:" + data.email;

        document.getElementById("location").innerText = data.location;
        document.getElementById("profile").innerText = data.profile;

        document.getElementById("education").innerHTML =
            `<li>${data.educationDetails[0].degree} - ${data.educationDetails[0].name}</li>
             <li>${data.educationDetails[1].degree} - ${data.educationDetails[1].name}</li>`;

        document.getElementById("experience").innerHTML =
            `<li>${data.internshipDetails[0].role}</li>
             <li>${data.internshipDetails[0].description}</li>`;

        document.getElementById("skills").innerHTML =
            `<li>${data.skills.join("</li><li>")}</li>`;

        document.getElementById("awards").innerHTML =
            `<li>${data.awards.join("</li><li>")}</li>`;

        document.getElementById("languages").innerHTML =
            `<li>${data.languages.join("</li><li>")}</li>`;

        document.getElementById("declaration").innerText = data.declaration;
    </script>

</body>

</html>
